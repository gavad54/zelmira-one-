name: VAYRO encrypted offsite database backup

on:
  workflow_dispatch:
  schedule:
    - cron: "17 2 * * *"

permissions:
  contents: read

concurrency:
  group: vayro-db-backup
  cancel-in-progress: false

jobs:
  backup:
    if: github.ref == 'refs/heads/main'
    environment: vayro-backup
    name: Dump, encrypt and upload private backup
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate required protected configuration
        shell: bash
        env:
          BACKUP_DATABASE_URL: ${{ secrets.VAYRO_BACKUP_DATABASE_URL }}
          AGE_RECIPIENT: ${{ vars.VAYRO_BACKUP_AGE_RECIPIENT }}
          S3_ACCESS_KEY_ID: ${{ secrets.VAYRO_R2_BACKUP_ACCESS_KEY_ID }}
          S3_SECRET_ACCESS_KEY: ${{ secrets.VAYRO_R2_BACKUP_SECRET_ACCESS_KEY }}
          S3_BUCKET: ${{ vars.VAYRO_R2_BUCKET }}
          S3_ENDPOINT: ${{ vars.VAYRO_R2_S3_ENDPOINT }}
          S3_REGION: ${{ vars.VAYRO_R2_REGION }}
        run: |
          set -euo pipefail
          for name in BACKUP_DATABASE_URL AGE_RECIPIENT S3_ACCESS_KEY_ID S3_SECRET_ACCESS_KEY S3_BUCKET S3_ENDPOINT S3_REGION; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Missing protected configuration: $name"
              exit 1
            fi
          done
          if [[ ! "$S3_ENDPOINT" =~ ^https://[A-Za-z0-9.-]+(:[0-9]{1,5})?(/[^[:space:]]*)?$ ]]; then
            echo "::error::S3 endpoint must be a valid HTTPS URL without credentials, query, or fragment"
            exit 1
          fi
          if [[ ! "$S3_BUCKET" =~ ^[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]$ ]]; then
            echo "::error::S3 bucket name is invalid"
            exit 1
          fi
          if [[ ! "$S3_REGION" =~ ^[a-z0-9][a-z0-9-]*$ ]]; then
            echo "::error::S3 region is invalid"
            exit 1
          fi

      - name: Install age and AWS CLI
        run: |
          sudo apt-get update
          sudo apt-get install --yes age awscli

      - name: Create and encrypt PostgreSQL 17 dump
        shell: bash
        env:
          BACKUP_DATABASE_URL: ${{ secrets.VAYRO_BACKUP_DATABASE_URL }}
          AGE_RECIPIENT: ${{ vars.VAYRO_BACKUP_AGE_RECIPIENT }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$RUNNER_TEMP/vayro-backup"
          chmod 700 "$RUNNER_TEMP/vayro-backup"
          trap 'rm -f "$RUNNER_TEMP/vayro-backup/vayro.dump"' EXIT
          docker run --rm --network host \
            -e BACKUP_DATABASE_URL \
            -v "$RUNNER_TEMP/vayro-backup:/backup" \
            postgres:17-alpine \
            sh -ceu 'pg_dump --format=custom --no-owner --no-acl "$BACKUP_DATABASE_URL" > /backup/vayro.dump'
          test -s "$RUNNER_TEMP/vayro-backup/vayro.dump"
          age --recipient "$AGE_RECIPIENT" \
            --output "$RUNNER_TEMP/vayro-backup/vayro.dump.age" \
            "$RUNNER_TEMP/vayro-backup/vayro.dump"
          cd "$RUNNER_TEMP/vayro-backup"
          sha256sum vayro.dump.age > vayro.dump.age.sha256
          rm -f "$RUNNER_TEMP/vayro-backup/vayro.dump"

      - name: Upload, read back and verify encrypted backup in private R2 bucket
        id: upload
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.VAYRO_R2_BACKUP_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.VAYRO_R2_BACKUP_SECRET_ACCESS_KEY }}
          AWS_EC2_METADATA_DISABLED: "true"
          AWS_CONFIG_FILE: ${{ runner.temp }}/aws-config
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
          S3_BUCKET: ${{ vars.VAYRO_R2_BUCKET }}
          S3_ENDPOINT: ${{ vars.VAYRO_R2_S3_ENDPOINT }}
          S3_REGION: ${{ vars.VAYRO_R2_REGION }}
        run: |
          set -euo pipefail
          mkdir -p "$(dirname "$AWS_CONFIG_FILE")"
          printf "[default]\ns3 =\n    addressing_style = path\n" > "$AWS_CONFIG_FILE"
          chmod 600 "$AWS_CONFIG_FILE"
          stamp="$(date -u +%Y/%m/%d/%H%M%S)"
          key="vayro/postgres/$stamp/vayro.dump.age"
          dump_file="$RUNNER_TEMP/vayro-backup/vayro.dump.age"
          checksum_file="$RUNNER_TEMP/vayro-backup/vayro.dump.age.sha256"
          readback_dump="$RUNNER_TEMP/vayro-backup/readback-vayro.dump.age"
          readback_checksum="$RUNNER_TEMP/vayro-backup/readback-vayro.dump.age.sha256"

          aws --endpoint-url "$S3_ENDPOINT" --region "$S3_REGION" \
            s3 cp "$dump_file" "s3://$S3_BUCKET/$key" --only-show-errors
          aws --endpoint-url "$S3_ENDPOINT" --region "$S3_REGION" \
            s3 cp "$checksum_file" "s3://$S3_BUCKET/$key.sha256" --only-show-errors

          remote_dump_size="$(aws --endpoint-url "$S3_ENDPOINT" --region "$S3_REGION" \
            s3api head-object --bucket "$S3_BUCKET" --key "$key" --query ContentLength --output text)"
          remote_checksum_size="$(aws --endpoint-url "$S3_ENDPOINT" --region "$S3_REGION" \
            s3api head-object --bucket "$S3_BUCKET" --key "$key.sha256" --query ContentLength --output text)"
          local_dump_size="$(wc -c < "$dump_file" | tr -d ' ')"
          local_checksum_size="$(wc -c < "$checksum_file" | tr -d ' ')"

          if [[ "$remote_dump_size" != "$local_dump_size" || "$remote_checksum_size" != "$local_checksum_size" ]]; then
            echo "::error::R2 object size verification failed; backup must not be treated as accepted"
            exit 1
          fi

          aws --endpoint-url "$S3_ENDPOINT" --region "$S3_REGION" \
            s3 cp "s3://$S3_BUCKET/$key" "$readback_dump" --only-show-errors
          aws --endpoint-url "$S3_ENDPOINT" --region "$S3_REGION" \
            s3 cp "s3://$S3_BUCKET/$key.sha256" "$readback_checksum" --only-show-errors

          bash scripts/verify-encrypted-backup-readback.sh \
            "$dump_file" "$readback_dump" "$checksum_file" "$readback_checksum"
          rm -f "$readback_dump" "$readback_checksum"

          echo "Encrypted backup uploaded; R2 sizes and downloaded SHA-256 read-back verified."
          {
            echo "## VAYRO encrypted backup upload"
            echo "- Object: s3://$S3_BUCKET/$key"
            echo "- Encrypted object bytes: $remote_dump_size"
            echo "- Checksum sidecar bytes: $remote_checksum_size"
            echo "- R2 HEAD metadata size verification: passed"
            echo "- Downloaded encrypted object and sidecar SHA-256 verification: passed"
            echo "- This does not replace an independent restore drill."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "object_key=$key" >> "$GITHUB_OUTPUT"
