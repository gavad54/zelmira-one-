name: VAYRO Android WebView build

on:
  push:
    branches:
      - integration/vayro-android-wrapper-2026-11-26
  workflow_dispatch:
    inputs:
      app_url:
        description: "Exact deployed VAYRO HTTPS origin; required for an installable test APK"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: vayro-android-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Resolve URL without falling back to shared product hosting
        id: app-url
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_URL: ${{ inputs.app_url }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            VAYRO_APP_URL="$INPUT_URL"
          else
            # Compile-only sentinel. The APK is never uploaded for push builds.
            VAYRO_APP_URL="https://vayro.invalid"
          fi
          if [[ ! "$VAYRO_APP_URL" =~ ^https://[A-Za-z0-9.-]+(:[0-9]{1,5})?(/[^[:space:]]*)?$ ]]; then
            echo "::error::A valid exact HTTPS VAYRO URL is required."
            exit 1
          fi
          if [[ "$VAYRO_APP_URL" == "https://vayro.invalid" && "$EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "::error::The internal compile-only URL cannot be used for an installable APK."
            exit 1
          fi
          echo "value=$VAYRO_APP_URL" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        env:
          VAYRO_APP_URL: ${{ steps.app-url.outputs.value }}
        run: gradle --no-daemon --stacktrace :app:assembleDebug -PVAYRO_APP_URL="$VAYRO_APP_URL"

      - name: Upload installable debug APK
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: vayro-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
