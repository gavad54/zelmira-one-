name: VAYRO Android Debug APK

on:
  push:
    branches:
      - feat/vayro-android-webview-wrapper
  workflow_dispatch:
    inputs:
      app_url:
        description: "HTTPS address used for internal VAYRO wrapper testing"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: vayro-android-debug-apk
  cancel-in-progress: false

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve and validate deployment URL
        id: app-url
        shell: bash
        env:
          VAYRO_APP_URL: ${{ github.event.inputs.app_url || vars.VAYRO_APP_URL || 'https://vayro-production.up.railway.app' }}
        run: |
          if [[ ! "$VAYRO_APP_URL" =~ ^https://[^/[:space:]]+([/][^[:space:]]*)?$ ]]; then
            echo "A valid HTTPS VAYRO deployment URL is required."
            exit 1
          fi
          echo "value=$VAYRO_APP_URL" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build installable debug APK
        env:
          VAYRO_APP_URL: ${{ steps.app-url.outputs.value }}
        run: |
          gradle --no-daemon --stacktrace :app:assembleDebug -PVAYRO_APP_URL="$VAYRO_APP_URL"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: vayro-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
