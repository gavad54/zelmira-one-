name: VAYRO isolated database restore drill

on:
  workflow_dispatch:
    inputs:
      backup_object_key:
        description: "Exact .dump.age object key in the private S3 bucket"
        required: true
        type: string
      confirmation:
        description: "Enter RESTORE_TO_ISOLATED_VAYRO_TEST to authorize this drill"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: vayro-db-restore-drill
  cancel-in-progress: false

jobs:
  restore:
    name: Verify, decrypt and restore to isolated PostgreSQL
    environment: vayro-restore
    if: ${{ github.ref == 'refs/heads/main' && inputs.confirmation == 'RESTORE_TO_ISOLATED_VAYRO_TEST' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Validate protected configuration and target separation
        shell: bash
        env:
          PRODUCTION_DATABASE_HOST: ${{ vars.VAYRO_PRODUCTION_DATABASE_HOST }}
          PRODUCTION_DATABASE_NAME: ${{ vars.VAYRO_PRODUCTION_DATABASE_NAME }}
          RESTORE_DATABASE_URL: ${{ secrets.VAYRO_ISOLATED_RESTORE_DATABASE_URL }}
          AGE_IDENTITY: ${{ secrets.VAYRO_BACKUP_AGE_IDENTITY }}
          S3_ACCESS_KEY_ID: ${{ secrets.VAYRO_R2_ACCESS_KEY_ID }}
          S3_SECRET_ACCESS_KEY: ${{ secrets.VAYRO_R2_SECRET_ACCESS_KEY }}
          S3_BUCKET: ${{ vars.VAYRO_R2_BUCKET }}
          S3_ENDPOINT: ${{ vars.VAYRO_R2_S3_ENDPOINT }}
          S3_REGION: ${{ vars.VAYRO_R2_REGION }}
          BACKUP_OBJECT_KEY: ${{ inputs.backup_object_key }}
        run: |
          set -euo pipefail
          for name in PRODUCTION_DATABASE_HOST PRODUCTION_DATABASE_NAME RESTORE_DATABASE_URL AGE_IDENTITY S3_ACCESS_KEY_ID S3_SECRET_ACCESS_KEY S3_BUCKET S3_ENDPOINT S3_REGION BACKUP_OBJECT_KEY; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Missing protected configuration: $name"
              exit 1
            fi
          done
          if [[ ! "$S3_ENDPOINT" =~ ^https://[A-Za-z0-9.-]+(:[0-9]{1,5})?(/[^[:space:]]*)?$ ]]; then
            echo "::error::S3 endpoint must be a valid HTTPS URL without credentials, query, or fragment"
            exit 1
          fi
          if [[ ! "$S3_BUCKET" =~ ^[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]$ ]]; then
            echo "::error::S3 bucket name is invalid"
            exit 1
          fi
          if [[ ! "$S3_REGION" =~ ^[a-z0-9][a-z0-9-]*$ ]]; then
            echo "::error::S3 region is invalid"
            exit 1
          fi
          if [[ ! "$BACKUP_OBJECT_KEY" =~ ^vayro/postgres/[0-9]{4}/[0-9]{2}/[0-9]{2}/[0-9]{6}/vayro\.dump\.age$ ]]; then
            echo "::error::Backup key does not match the generated VAYRO backup object format"
            exit 1
          fi
          python3 - <<'PY'
          import os
          from urllib.parse import urlparse
          production_host = os.environ["PRODUCTION_DATABASE_HOST"].strip().lower()
          production_database = os.environ["PRODUCTION_DATABASE_NAME"].strip().lower()
          target = urlparse(os.environ["RESTORE_DATABASE_URL"])
          if not production_host or not production_database or not target.hostname:
              raise SystemExit("Production host, production database name and restore target hostname are required")
          if production_host == target.hostname.lower():
              raise SystemExit("Restore target must use a different database host from production")
          if not target.path or target.path == "/":
              raise SystemExit("Restore target must name an explicit isolated database")
          if production_database == target.path.lstrip("/").lower():
              raise SystemExit("Restore target must not use the production database name")
          print("Restore target host and database name differ from production; continuing.")
          PY

      - name: Install age and AWS CLI
        run: |
          sudo apt-get update
          sudo apt-get install --yes age awscli

      - name: Download, verify and decrypt selected backup
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.VAYRO_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.VAYRO_R2_SECRET_ACCESS_KEY }}
          AWS_EC2_METADATA_DISABLED: "true"
          AWS_CONFIG_FILE: ${{ runner.temp }}/aws-config
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
          S3_BUCKET: ${{ vars.VAYRO_R2_BUCKET }}
          S3_ENDPOINT: ${{ vars.VAYRO_R2_S3_ENDPOINT }}
          S3_REGION: ${{ vars.VAYRO_R2_REGION }}
          BACKUP_OBJECT_KEY: ${{ inputs.backup_object_key }}
          AGE_IDENTITY: ${{ secrets.VAYRO_BACKUP_AGE_IDENTITY }}
        run: |
          set -euo pipefail
          mkdir -p "$(dirname "$AWS_CONFIG_FILE")"
          printf "[default]\ns3 =\n    addressing_style = path\n" > "$AWS_CONFIG_FILE"
          chmod 600 "$AWS_CONFIG_FILE"
          umask 077
          mkdir -p "$RUNNER_TEMP/vayro-restore"
          chmod 700 "$RUNNER_TEMP/vayro-restore"
          trap 'rm -f "$RUNNER_TEMP/vayro-restore/age-identity.txt"' EXIT
          aws --endpoint-url "$S3_ENDPOINT" --region "$S3_REGION" \
            s3 cp "s3://$S3_BUCKET/$BACKUP_OBJECT_KEY" \
            "$RUNNER_TEMP/vayro-restore/vayro.dump.age" --only-show-errors
          aws --endpoint-url "$S3_ENDPOINT" --region "$S3_REGION" \
            s3 cp "s3://$S3_BUCKET/$BACKUP_OBJECT_KEY.sha256" \
            "$RUNNER_TEMP/vayro-restore/vayro.dump.age.sha256" --only-show-errors
          cd "$RUNNER_TEMP/vayro-restore"
          sha256sum --check vayro.dump.age.sha256
          printf '%s\n' "$AGE_IDENTITY" > age-identity.txt
          chmod 600 age-identity.txt
          age --decrypt --identity age-identity.txt \
            --output backup.dump vayro.dump.age
          test -s backup.dump
          docker run --rm -v "$RUNNER_TEMP/vayro-restore:/backup:ro" postgres:17-alpine \
            pg_restore --list /backup/backup.dump > "$RUNNER_TEMP/vayro-restore/archive-list.txt"
          test -s "$RUNNER_TEMP/vayro-restore/archive-list.txt"
          rm -f age-identity.txt

      - name: Require an empty isolated PostgreSQL 17 target and restore
        shell: bash
        env:
          RESTORE_DATABASE_URL: ${{ secrets.VAYRO_ISOLATED_RESTORE_DATABASE_URL }}
          EMPTY_SCHEMA_SQL: "SELECT (SELECT count(*) FROM pg_namespace WHERE nspname NOT LIKE 'pg_%' AND nspname NOT IN ('information_schema','public')) + (SELECT count(*) FROM pg_class c JOIN pg_namespace n ON n.oid=c.relnamespace WHERE n.nspname NOT LIKE 'pg_%' AND n.nspname <> 'information_schema' AND c.relkind IN ('r','p','v','m','S','f')) + (SELECT count(*) FROM pg_proc p JOIN pg_namespace n ON n.oid=p.pronamespace WHERE n.nspname NOT LIKE 'pg_%' AND n.nspname <> 'information_schema') + (SELECT count(*) FROM pg_type t JOIN pg_namespace n ON n.oid=t.typnamespace WHERE n.nspname NOT LIKE 'pg_%' AND n.nspname <> 'information_schema' AND t.typtype IN ('c','d','e','r')) + (SELECT count(*) FROM pg_extension WHERE extname <> 'plpgsql') + (SELECT count(*) FROM pg_largeobject_metadata)"
        run: |
          set -euo pipefail
          trap 'rm -f "$RUNNER_TEMP/vayro-restore/backup.dump"' EXIT
          target_version="$(docker run --rm --network host -e RESTORE_DATABASE_URL postgres:17-alpine \
            sh -ceu 'psql "$RESTORE_DATABASE_URL" -v ON_ERROR_STOP=1 -Atqc "SHOW server_version_num"')"
          if [[ ! "$target_version" =~ ^17[0-9]{4}$ ]]; then
            echo "::error::Restore target must be PostgreSQL 17; detected server_version_num=$target_version"
            exit 1
          fi

          object_count="$(
            docker run --rm --network host -e RESTORE_DATABASE_URL -e EMPTY_SCHEMA_SQL postgres:17-alpine \
              sh -ceu 'psql "$RESTORE_DATABASE_URL" -v ON_ERROR_STOP=1 -Atqc "$EMPTY_SCHEMA_SQL"'
          )"
          if [[ "$object_count" != "0" ]]; then
            echo "::error::Restore target contains user schemas or objects outside PostgreSQL system catalogs; refusing to restore"
            exit 1
          fi
          docker run --rm --network host -e RESTORE_DATABASE_URL \
            -v "$RUNNER_TEMP/vayro-restore:/backup:ro" \
            postgres:17-alpine \
            pg_restore --exit-on-error --no-owner --no-acl \
              --dbname="$RESTORE_DATABASE_URL" /backup/backup.dump
          restored_relations="$(docker run --rm --network host -e RESTORE_DATABASE_URL postgres:17-alpine psql "$RESTORE_DATABASE_URL" -v ON_ERROR_STOP=1 -Atqc "SELECT count(*) FROM pg_class c JOIN pg_namespace n ON n.oid=c.relnamespace WHERE n.nspname NOT LIKE 'pg_%' AND n.nspname <> 'information_schema' AND c.relkind IN ('r','p','v','m','S','f')")"
          if [[ ! "$restored_relations" =~ ^[0-9]+$ || "$restored_relations" == "0" ]]; then
            echo "::error::Restore finished but no user relations were detected; restore is not accepted"
            exit 1
          fi

          cat > "$RUNNER_TEMP/vayro-restore/validate.sql" <<'SQL'
          DO $vayro$
          DECLARE
            rel record;
            total_rows bigint := 0;
            row_count bigint;
          BEGIN
            FOR rel IN
              SELECT schemaname, tablename
              FROM pg_tables
              WHERE schemaname NOT IN ('pg_catalog', 'information_schema')
            LOOP
              EXECUTE format('SELECT count(*) FROM %I.%I', rel.schemaname, rel.tablename) INTO row_count;
              total_rows := total_rows + row_count;
            END LOOP;
            RAISE NOTICE 'row_count=%', total_rows;
          END $vayro$;
          SELECT 'extensions=' || count(*) FROM pg_extension;
          SELECT 'rls_tables=' || count(*) FROM pg_class c JOIN pg_namespace n ON n.oid=c.relnamespace
            WHERE n.nspname NOT IN ('pg_catalog','information_schema') AND c.relkind IN ('r','p') AND c.relrowsecurity;
          SELECT 'forced_rls_tables=' || count(*) FROM pg_class c JOIN pg_namespace n ON n.oid=c.relnamespace
            WHERE n.nspname NOT IN ('pg_catalog','information_schema') AND c.relkind IN ('r','p') AND c.relforcerowsecurity;
          SELECT 'policies=' || count(*) FROM pg_policies;
          SELECT 'rls_tables_without_policy=' || count(*)
            FROM pg_class c JOIN pg_namespace n ON n.oid=c.relnamespace
            WHERE n.nspname NOT IN ('pg_catalog','information_schema')
              AND c.relkind IN ('r','p') AND c.relrowsecurity
              AND NOT EXISTS (SELECT 1 FROM pg_policies p WHERE p.schemaname=n.nspname AND p.tablename=c.relname);
          SQL
          validation="$(docker run --rm --network host -e RESTORE_DATABASE_URL \
            -v "$RUNNER_TEMP/vayro-restore:/backup:ro" postgres:17-alpine \
            sh -ceu 'psql "$RESTORE_DATABASE_URL" -v ON_ERROR_STOP=1 -At -f /backup/validate.sql' 2>&1)"
          printf '%s\\n' "$validation" | tee "$RUNNER_TEMP/vayro-restore/validation.txt"
          if ! grep -Eq 'row_count=[0-9]+' "$RUNNER_TEMP/vayro-restore/validation.txt"; then
            echo "::error::Restore validation did not produce a total row-count result"
            exit 1
          fi
          if ! grep -Eq 'extensions=[1-9][0-9]*' "$RUNNER_TEMP/vayro-restore/validation.txt"; then
            echo "::error::No PostgreSQL extensions were detected after restore"
            exit 1
          fi
          if ! grep -Eq 'policies=[1-9][0-9]*' "$RUNNER_TEMP/vayro-restore/validation.txt"; then
            echo "::error::No RLS policies were detected after restore"
            exit 1
          fi
          if ! grep -Eq 'rls_tables_without_policy=0' "$RUNNER_TEMP/vayro-restore/validation.txt"; then
            echo "::error::At least one RLS-enabled table has no policy"
            exit 1
          fi
          {
            echo "## VAYRO isolated restore drill"
            echo "- PostgreSQL target version: 17"
            echo "- User relations detected after restore: $restored_relations"
            echo "- Restore data row-count, extensions, RLS flags and policy checks: passed"
            echo "- pg_restore: completed with --exit-on-error"
            cat "$RUNNER_TEMP/vayro-restore/validation.txt"
            echo "- Role ownership and grants are not asserted; dump uses --no-owner --no-acl."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "Restore completed; data and RLS validation passed. Ownership and grants remain outside this drill."
