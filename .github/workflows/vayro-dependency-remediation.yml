name: VAYRO dependency remediation validation

on:
  pull_request:
    branches:
      - main
    paths:
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/vayro-dependency-remediation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-remediation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply reviewed non-breaking transitive dependency override
        run: |
          npm pkg set 'overrides.effect=3.22.1'
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Verify clean lockfile installation
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run dependency security audit
        run: npm audit --audit-level=moderate
      - name: Upload generated package manifests for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vayro-dependency-remediation-manifests
          path: |
            package.json
            package-lock.json
          if-no-files-found: error
