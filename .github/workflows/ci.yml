name: VAYRO CI

on:
  push:
    branches: [main, brand/vayro-name-only, security/mfa-session-endpoint-gates, upgrade/full-independent-product-family-modules-2026-11-20, engineering/vayro-full-platform-audit-archive-2026-11-26]
  pull_request:
    branches: [main, brand/vayro-name-only]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: vayro_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d vayro_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/vayro_ci?schema=public
      AUTH_DATABASE_URL: postgresql://vayro_auth_ci:ci-only@localhost:5432/vayro_ci?schema=public
      PLATFORM_DATABASE_URL: postgresql://vayro_platform_ci:ci-only@localhost:5432/vayro_ci?schema=public
      MIGRATION_DATABASE_URL: postgresql://ci:ci@localhost:5432/vayro_ci?schema=public
      CI_DATABASE_URL: postgresql://ci:ci@localhost:5432/vayro_ci
      TENANT_DATABASE_URL: postgresql://vayro_tenant_ci:ci-only@localhost:5432/vayro_ci
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      # Enforce the dependency-security gate: moderate, high and critical advisories fail CI.
      - name: Enforce locked dependency security audit
        run: npm audit --audit-level=moderate
      - name: Run unit tests
        run: npm test
      - name: Generate Prisma client
        run: npx prisma generate
      - name: Validate Prisma schema
        run: npx prisma validate
      - name: Prepare least-privilege roles in isolated PostgreSQL
        run: psql "postgresql://ci:ci@localhost:5432/vayro_ci" -v ON_ERROR_STOP=1 -c 'CREATE ROLE anon NOLOGIN; CREATE ROLE authenticated NOLOGIN; CREATE ROLE service_role NOLOGIN;'
      - name: Apply real Prisma migration history
        run: npx prisma migrate deploy
      - name: Verify repeated Prisma migrate deploy is a no-op
        run: npx prisma migrate deploy
      - name: Reconcile Prisma models, migration ledger, and protected RLS catalog (isolated PostgreSQL only)
        run: psql "$CI_DATABASE_URL" -v ON_ERROR_STOP=1 -f tests/sql/catalog-reconciliation.sql
      - name: Verify complete core RLS policy and FORCE-RLS coverage (isolated PostgreSQL only)
        run: psql "$CI_DATABASE_URL" -v ON_ERROR_STOP=1 -f tests/sql/rls-policy-coverage.sql
      - name: Prove authentication database role isolation (isolated PostgreSQL only)
        run: psql "$CI_DATABASE_URL" -v ON_ERROR_STOP=1 -f tests/sql/auth-db-role-boundary.sql
      - name: Enable dedicated authentication runtime login in isolated CI only
        run: psql "$CI_DATABASE_URL" -v ON_ERROR_STOP=1 -c "CREATE ROLE vayro_auth_ci LOGIN PASSWORD 'ci-only' IN ROLE vayro_auth;"
      - name: Enable dedicated task worker runtime login in isolated CI only
        run: psql "$CI_DATABASE_URL" -v ON_ERROR_STOP=1 -c "CREATE ROLE vayro_task_worker_ci LOGIN PASSWORD 'ci-only' IN ROLE vayro_task_worker;"
      - name: Prove task worker least-privilege function boundary (isolated PostgreSQL only)
        run: psql "$CI_DATABASE_URL" -v ON_ERROR_STOP=1 -c "SET ROLE vayro_task_worker_ci" -f tests/sql/task-worker-role-boundary.sql
      - name: Verify registered executor and independent reviewer flow (isolated PostgreSQL only)
        run: psql "$CI_DATABASE_URL" -v ON_ERROR_STOP=1 -f tests/sql/task-worker-agent-review.integration.sql
      - name: Enable dedicated scheduler runtime login in isolated CI only
        run: psql "$CI_DATABASE_URL" -v ON_ERROR_STOP=1 -c "CREATE ROLE vayro_task_scheduler_ci LOGIN PASSWORD 'ci-only' IN ROLE vayro_task_scheduler;"
      - name: Prove scheduler least-privilege function boundary (isolated PostgreSQL only)
        run: psql "$CI_DATABASE_URL" -v ON_ERROR_STOP=1 -c "SET ROLE vayro_task_scheduler_ci" -f tests/sql/scheduler-worker-role-boundary.sql
      - name: Verify recurring schedule materialization and goal reconciliation (isolated PostgreSQL only)
        run: psql "$CI_DATABASE_URL" -v ON_ERROR_STOP=1 -f tests/sql/recurring-scheduler-goal-reconciliation.integration.sql
      - name: Verify dependency-gated task claims in isolated PostgreSQL
        run: psql "$CI_DATABASE_URL" -v ON_ERROR_STOP=1 -f tests/sql/task-dependency-claim.integration.sql
      - name: Verify worker restart recovery and stale-lease fencing (isolated PostgreSQL only)
        run: psql "$CI_DATABASE_URL" -v ON_ERROR_STOP=1 -f tests/sql/task-worker-restart-recovery.integration.sql
      - name: Prove platform database role isolation (isolated PostgreSQL only)
        run: psql "$CI_DATABASE_URL" -v ON_ERROR_STOP=1 -f tests/sql/platform-db-role-boundary.sql
      - name: Enable dedicated platform runtime login in isolated CI only
        run: psql "$CI_DATABASE_URL" -v ON_ERROR_STOP=1 -c "CREATE ROLE vayro_platform_ci LOGIN PASSWORD 'ci-only' IN ROLE vayro_platform;"
      - name: Create a dedicated tenant runtime login for RLS and integration tests
        run: psql "$CI_DATABASE_URL" -v ON_ERROR_STOP=1 -c "CREATE ROLE vayro_tenant_ci LOGIN PASSWORD 'ci-only' IN ROLE vayro_app"
      - name: Prove tenant RLS isolation using the dedicated runtime login (isolated PostgreSQL only)
        run: psql "$CI_DATABASE_URL" -v ON_ERROR_STOP=1 -f tests/sql/tenant-rls-isolation.sql
      - name: Rehearse synthetic initial-schema upgrade in isolated PostgreSQL 17
        env:
          UPGRADE_DATABASE_URL: postgresql://ci:ci@localhost:5432/vayro_upgrade_ci
        run: |
          PGPASSWORD=ci createdb -h localhost -p 5432 -U ci vayro_upgrade_ci
          psql "$UPGRADE_DATABASE_URL" -v ON_ERROR_STOP=1 -f prisma/migrations/20261106055500_init_vayro_core/migration.sql
          psql "$UPGRADE_DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          INSERT INTO public."User" ("id","email","passwordHash","displayName","updatedAt")
          VALUES ('upgrade-user','upgrade@example.invalid','synthetic-hash','Synthetic Upgrade User',CURRENT_TIMESTAMP);
          INSERT INTO public."Tenant" ("id","name","slug","updatedAt")
          VALUES ('upgrade-tenant','Synthetic Upgrade Tenant','synthetic-upgrade-tenant',CURRENT_TIMESTAMP);
          INSERT INTO public."Membership" ("id","userId","tenantId","role")
          VALUES ('upgrade-membership','upgrade-user','upgrade-tenant','MEMBER');
          INSERT INTO public."Session" ("id","tokenHash","userId","expiresAt")
          VALUES ('upgrade-session','synthetic-session-token-hash','upgrade-user',CURRENT_TIMESTAMP + INTERVAL '1 day');
          INSERT INTO public."Product" ("id","key","name","description","updatedAt")
          VALUES ('upgrade-product','UPGRADE_FIXTURE','Synthetic Upgrade Product','Synthetic migration fixture',CURRENT_TIMESTAMP);
          INSERT INTO public."License" ("id","tenantId","productId","startsAt")
          VALUES ('upgrade-license','upgrade-tenant','upgrade-product',CURRENT_TIMESTAMP);
          INSERT INTO public."AuditEvent" ("id","actorUserId","tenantId","action","resource")
          VALUES ('upgrade-audit','upgrade-user','upgrade-tenant','synthetic.upgrade.fixture','SyntheticFixture');
          INSERT INTO public."EmailContact" ("id","email","label","purposes","updatedAt")
          VALUES ('upgrade-email-contact','upgrade-contact@example.invalid','Synthetic contact',ARRAY['OWNER']::public."EmailPurpose"[],CURRENT_TIMESTAMP);
          INSERT INTO public."EmailContactVerificationToken" ("id","tokenHash","contactId","expiresAt")
          VALUES ('upgrade-email-token','synthetic-email-token-hash','upgrade-email-contact',CURRENT_TIMESTAMP + INTERVAL '1 day');
          INSERT INTO public."AuthActionToken" ("id","tokenHash","userId","purpose","expiresAt")
          VALUES ('upgrade-auth-token','synthetic-auth-token-hash','upgrade-user','EMAIL_VERIFY',CURRENT_TIMESTAMP + INTERVAL '1 day');
          INSERT INTO public."AuthRateLimit" ("keyHash","windowStartedAt","count","expiresAt")
          VALUES ('synthetic-rate-limit-key',CURRENT_TIMESTAMP,1,CURRENT_TIMESTAMP + INTERVAL '1 day');
          SQL
          DATABASE_URL="$UPGRADE_DATABASE_URL" MIGRATION_DATABASE_URL="$UPGRADE_DATABASE_URL" npx prisma migrate resolve --applied 20261106055500_init_vayro_core
      - name: Inject a controlled PostgreSQL migration failure and verify rollback recovery
        env:
          UPGRADE_DATABASE_URL: postgresql://ci:ci@localhost:5432/vayro_upgrade_ci
        run: |
          if psql "$UPGRADE_DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          BEGIN;
          \i prisma/migrations/20261108000000_mfa_session_foundation/migration.sql
          SELECT 1 / 0;
          COMMIT;
          SQL
          then
            echo "::error::Injected migration failure unexpectedly succeeded"
            exit 1
          fi
          psql "$UPGRADE_DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          BEGIN
            IF to_regclass('public."UserMfa"') IS NOT NULL
              OR to_regclass('public."MfaRecoveryCode"') IS NOT NULL
              OR to_regclass('public."AuthChallenge"') IS NOT NULL
              OR EXISTS (
                SELECT 1 FROM pg_type t
                JOIN pg_namespace n ON n.oid = t.typnamespace
                WHERE n.nspname = 'public'
                  AND t.typname IN ('SessionAssurance', 'AuthChallengePurpose')
              )
              OR (
                SELECT count(*) FROM information_schema.columns
                WHERE table_schema = 'public'
                  AND table_name = 'Session'
                  AND column_name IN ('revokedAt', 'lastSeenAt', 'assurance', 'mfaAuthenticatedAt')
              ) <> 0
            THEN
              RAISE EXCEPTION 'FAILED_MIGRATION_LEFT_PARTIAL_SCHEMA';
            END IF;
          END
          $$;
          SQL
          DATABASE_URL="$UPGRADE_DATABASE_URL" MIGRATION_DATABASE_URL="$UPGRADE_DATABASE_URL" npx prisma migrate deploy
      - name: Verify synthetic fixture values and upgraded schema after PostgreSQL 17 rehearsal
        env:
          UPGRADE_DATABASE_URL: postgresql://ci:ci@localhost:5432/vayro_upgrade_ci
        run: psql "$UPGRADE_DATABASE_URL" -v ON_ERROR_STOP=1 -f tests/sql/synthetic-upgrade-preservation.sql
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Production build
        run: npm run build
        env:
          NEXT_PUBLIC_APP_URL: http://localhost:3000
      - name: Verify production build without runtime database credentials
        run: env -u AUTH_DATABASE_URL -u PLATFORM_DATABASE_URL -u TENANT_DATABASE_URL NEXT_PUBLIC_APP_URL=https://vayro.invalid npm run build
      - name: Build production Docker image
        run: docker build --pull --tag vayro-ci:local .
      - name: Run PostgreSQL and production HTTP integration tests
        run: npm run test:integration
