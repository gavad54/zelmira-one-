name: VAYRO CI

on:
  push:
    branches: [main, brand/vayro-name-only]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: vayro_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d vayro_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/vayro_ci?schema=public
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      # Enforce the dependency-security gate: moderate, high and critical advisories fail CI.
      - name: Enforce locked dependency security audit
        run: npm audit --audit-level=moderate
      - name: Run unit tests
        run: npm test
      - name: Generate Prisma client
        run: npx prisma generate
      - name: Validate Prisma schema
        run: npx prisma validate
      - name: Prepare least-privilege roles in isolated PostgreSQL
        run: psql "postgresql://ci:ci@localhost:5432/vayro_ci" -v ON_ERROR_STOP=1 -c 'CREATE ROLE anon NOLOGIN; CREATE ROLE authenticated NOLOGIN; CREATE ROLE service_role NOLOGIN;'
      - name: Apply real Prisma migration history
        run: npx prisma migrate deploy
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Production build
        run: npm run build
        env:
          NEXT_PUBLIC_APP_URL: http://localhost:3000
      - name: Run PostgreSQL and production HTTP integration tests
        run: npm run test:integration
