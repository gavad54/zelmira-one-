<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 190" role="img" aria-labelledby="title desc">
  <title id="title">VAYRO</title>
  <desc id="desc">VAYRO brand mark and wordmark in ice blue and champagne gold.</desc>
  <defs>
    <linearGradient id="vayro-metal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#bcefff"/>
      <stop offset=".42" stop-color="#4aa9f5"/>
      <stop offset=".7" stop-color="#d9c18e"/>
      <stop offset="1" stop-color="#fff0c7"/>
    </linearGradient>
    <linearGradient id="vayro-word" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f4e4bd"/>
      <stop offset=".5" stop-color="#d8bd83"/>
      <stop offset="1" stop-color="#a7dcf6"/>
    </linearGradient>
    <filter id="soft-glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
