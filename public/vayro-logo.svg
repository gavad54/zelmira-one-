    <path d="M13 18h27M130 18h27" fill="none" stroke="#e7f8ff" stroke-opacity=".55" stroke-width="3" stroke-linecap="round"/>
    <circle cx="84" cy="8" r="4" fill="#d8bd83"/>
  </g>
  <text x="205" y="126" fill="url(#vayro-word)" font-family="Arial, Helvetica, sans-serif" font-size="108" font-weight="700" letter-spacing="7">VAYRO</text>
  <path d="M210 151h435" stroke="#6dbce8" stroke-opacity=".55" stroke-width="2"/>
